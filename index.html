const GUIDE=[['Buat akun dan masuk','Klik <b>Mulai Menanam</b>, lalu pilih <b>Daftar</b>. Isi nama, email atau username, dan kata sandi (minimal 8 karakter). Setelah itu kamu masuk ke Beranda dengan <b>100 Poin Air</b> sebagai bekal.'],['Tanam kebiasaanmu','Buka menu <b>Tanam</b>. Tulis kebiasaan di kolom bawah, misalnya “Minum air 1,5 liter”, lalu klik <b>+ Tanam</b>. Klik ✎ untuk mengubah dan ✕ untuk menghapus.'],['Centang setiap hari','Klik kotak di samping kebiasaan yang sudah kamu kerjakan. Setiap centang memberi <b>+10 Poin Air</b> (sekali per kebiasaan per hari), dan persentase progresmu naik otomatis.'],['Lihat lotusmu tumbuh','Buka <b>Tumbuh</b>. Lotusmu berubah sesuai progres hari ini: Biji (0%), Tunas (1–39%), Berdaun (40–69%), Kuncup (70–99%), Mekar Penuh (100%). Jika kemarin kurang dari 30%, lotus tampak layu sampai kamu mencapai target atau menyiramnya.'],['Selesaikan misi harian','Buka <b>Misi</b>. Ada tiga misi berbeda setiap hari. Tiap misi selesai memberi <b>+15 poin</b>, dan menyelesaikan ketiganya memberi <b>bonus +20 poin</b>.'],['Rawat lotus dan hias kolam','Di <b>Rawat</b>, pakai poin untuk Siram (10), Pupuk (20), atau Bersihkan Kolam (15). Di <b>Dekorasi</b>, beli hiasan (30–80 poin), lalu tarik ke kolam di bagian Pratinjau &amp; Koleksi dan klik <b>Simpan Tata Letak</b>.'],['Pantau perkembanganmu','Buka <b>Kebun</b> untuk melihat kalender konsistensi (makin gelap hijaunya, makin rajin kamu). Klik tanggal untuk melihat detailnya. Grafik <b>Seminggu Terakhir</b> di Tanam membandingkan minggu ini dengan minggu lalu.']];
const DESK=()=>`<section id="deskripsi" class="desc wrap"><div class="dtop"><div class="eb" style="color:#fff;opacity:.9">TENTANG FLOURISH</div><h3 style="margin-top:.5rem">Sering semangat di awal, lalu berhenti di tengah jalan?</h3><div class="lead">Setiap lotus besar berawal dari satu biji kecil.</div><p>Kamu tidak sendirian. Kebiasaan baik sering gagal bukan karena kita malas, tetapi karena hasilnya tidak terlihat. Flourish membuat progresmu bisa dilihat.</p><div class="dtwo"><div><h4>Apa itu Flourish?</h4><p>Flourish adalah website pencatat kebiasaan yang mengubah daftar kegiatan harianmu menjadi kolam lotus yang hidup. Setiap kebiasaan yang kamu selesaikan membuat lotusmu tumbuh, dari biji, tunas, berdaun, kuncup, sampai mekar penuh.</p></div><div><h4>Untuk apa?</h4><p>Untuk membantumu membangun kebiasaan baik, seperti minum air, olahraga, belajar, atau tidur teratur. Kamu cukup mencentang, dan Flourish menghitung progresmu, mengumpulkan Poin Air, serta menunjukkan hasilnya dalam bentuk yang indah.</p></div></div><p class="qt" style="margin-top:1.4rem">Tidak perlu sempurna, cukup mulai hari ini.<br>“Makin konsisten, makin tumbuh”</p></div><h2 class="fh">Kenapa kamu akan menyukainya</h2><div class="fgrid">${FEAT.map(f=>`<div class="card fc2"><div class="ibox">${icon(f[0])}</div><div><h3>${f[1]}</h3><div class="mu" style="font-size:.95rem">${f[2]}</div></div></div>`).join('')}</div></section>`;
const GUIDES=()=>`<section id="petunjuk" class="desc wrap"><h2 class="fh" style="margin-top:0">Cara memakai Flourish, langkah demi langkah</h2><div class="steps2">${GUIDE.map((s,i)=>`<div class="stp"><span class="n">${i+1}</span><div><h4>${s[0]}</h4><div class="tx">${s[1]}</div></div></div>`).join('')}</div></section>`;
const CTAB=()=>`<section class="wrap" style="padding-bottom:1rem"><div class="card cta"><div>${lot(4,100)}</div><div><h3>Siap menumbuhkan lotusmu?</h3><div class="mu">${sess?'Lanjutkan perjalananmu di kolam lotus.':'Masuk atau daftar, lalu tanam kebiasaan pertamamu hari ini'}</div></div><div style="text-align:center">${sess?`<button class="btn pk" data-go="beranda" style="padding:16px 60px">Ke Beranda</button>`:`<button class="btn pk" data-go="login" style="padding:16px 60px">Mulai Menanam</button><div style="margin-top:10px;font-size:14px">Sudah punya akun? <a data-go="login" style="color:${BY};font-weight:600">Masuk</a> - Belum? <a data-go="daftar" style="color:${BY};font-weight:600">Daftar</a></div>`}</div></div></section>`;
/* ---------- halaman ---------- */
const lotusState=()=>{const a=L0().act,did=pctT()>0||a.watered+a.fert+a.clean>0;if(layu())return{l:'Layu ringan',c:'no',m:'Siram lotusmu agar kembali segar'};if(!did)return{l:'Belum terawat',c:'run',m:'Belum ada aktivitas hari ini. Centang kebiasaan atau rawat lotusmu.'};if(D.vit>=70)return{l:'Sehat',c:'ok',m:'Lotusmu tampak segar hari ini'};if(D.vit>=40)return{l:'Cukup segar',c:'run',m:'Beri pupuk atau bersihkan kolam agar lebih segar'};return{l:'Perlu dirawat',c:'no',m:'Energi lotus rendah. Siram atau pupuk lotusmu'}};
const NAVS=[['beranda','Beranda'],['tanam','Tanam'],['tumbuh','Tumbuh'],['kebun','Kebun'],['misi','Misi'],['rawat','Rawat'],['dekorasi','Dekorasi']];
const nav=r=>`<nav class="nav" aria-label="Menu utama"><a data-go="beranda">${logoH()}</a><div class="lk">${NAVS.map(n=>`<a class="l ${n[0]==r?'on':''}" data-go="${n[0]}">${n[1]}</a>`).join('')}<a class="l gd ${r=='petunjuk'?'on':''}" data-to="petunjuk">Petunjuk</a></div>${pts()}<button class="out" data-act="logout">Keluar</button></nav>`;
const foot=()=>`<footer class="foot"><div class="in2"><div><span class="logo">${lot(3,24)}Flourish</span><div class="ftag">Website pencatat kebiasaan dengan visualisasi pertumbuhan lotus</div></div><div class="fl2"><a data-to="deskripsi">Tentang Flourish</a><a data-to="petunjuk">Petunjuk Penggunaan</a></div></div><div class="cp">© 2026 Flourish - Website Pencatat Kebiasaan</div></footer>`;
const shell=(r,inner)=>`${nav(r)}<main class="view">${inner}</main>${foot()}`;
const authP=k=>{const L=k=='login';return`<div class="auth"><div class="alc"><a data-go="landing">${logoH('font-size:34px')}</a><div class="pondbox">${pondH(4,{items:[]})}</div><h1>Tumbuhkan kebiasaanmu, <span>tumbuhkan dirimu</span></h1><p class="mu">Catat kebiasaan, rawat lotus, dan lihat kolammu berkembang</p></div><form class="card fc" id="af" autocomplete="off"><h2>${L?'Selamat datang kembali':'Buat akun baru'}</h2><p class="sub mu">${L?'Masuk untuk melanjutkan perjalanan tumbuhmu':'Isi data di bawah untuk mulai menanam'}</p>${L?'':`<label for="nm">Nama Lengkap</label><input class="in" id="nm" placeholder="Nama kamu">`}<label for="un">Username / Email</label><input class="in" id="un" placeholder="nama@email.com" autocomplete="username"><label for="pw">Kata sandi</label><input class="in" id="pw" type="password" placeholder="${L?'••••••••':'Minimal 8 karakter'}" autocomplete="${L?'current-password':'new-password'}">${L?'':`<label for="pw2">Konfirmasi kata sandi</label><input class="in" id="pw2" type="password" placeholder="Ulangi kata sandi">`}<div class="err" id="er"></div><button class="btn pk" type="submit">${L?'Masuk':'Daftar'}</button><div class="sw">${L?'Belum punya akun? <a data-go="daftar">Daftar</a>':'Sudah punya akun? <a data-go="login">Masuk</a>'}</div></form></div>`};
const cardsM=[['01','Tanam','Checklist kebiasaan harian','seed','tanam'],['02','Tumbuh','Lotus lima tahap','young','tumbuh'],['03','Kebun','Kalender konsistensi','lot','kebun'],['04','Misi Harian','Tiga misi tiap hari','bud','misi'],['05','Rawat Lotus','Siram - pupuk - bersihkan','rawat','rawat'],['06','Dekorasi Kolam','Toko & tata hiasan','koi','dekorasi']];
const wrapG=(r,inner)=>{const back=`<section class="wrap" style="text-align:center;padding:1.8rem 0 .6rem"><button class="btn pk" data-go="${sess?'beranda':'landing'}" style="padding:16px 56px">← Kembali ke ${sess?'Beranda':'Halaman Awal'}</button></section>`;return sess?shell(r,inner+back):`<div class="plogo"><a data-go="landing">${logoH('font-size:32px')}</a></div>${inner}${back}${foot()}`};
const ROUTES={
landing:()=>`<div class="plogo"><a data-go="landing">${logoH('font-size:32px')}</a>${sess?'<button class="btn pk sm" data-go="beranda">← Kembali ke Beranda</button>':''}</div><div class="wrap">${heroB('Deskripsi & Petunjuk','data-scroll="#deskripsi"')}</div>${DESK()}${GUIDES()}${CTAB()}${foot()}`,
tentang:()=>wrapG('tentang',DESK()),
petunjuk:()=>wrapG('petunjuk',GUIDES()),
login:()=>authP('login'),daftar:()=>authP('daftar'),
beranda:()=>shell('beranda',`<section class="wrap">${heroB('Mulai Menanam','data-go="tanam"')}</section><section class="wrap sec"><h2 class="ct">Kenali bagian-bagian kolammu</h2><div class="mgrid">${cardsM.map(c=>`<div class="card mc" data-go="${c[4]}" tabindex="0"><span class="no">${c[0]}</span><div class="ic">${icon(c[3])}</div><h3>${c[1]}</h3><div class="mu">${c[2]}</div></div>`).join('')}<div class="side" style="grid-column:4;grid-row:1/3;align-self:center"><div class="ptc"><span>Poin Air milikmu</span><b>${D.pts}</b></div></div></div><div class="card how"><b>Cara kerja:</b> &nbsp; 1. Centang kebiasaan - 2. Kumpulkan Poin Air - 3. Rawat lotus dan hias kolam</div></section>`),
tanam:()=>{const L=L0(),dn=new Set(L.done),p=pctT(),st=stageOf(p);const dt=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
 const wk=weekData(),mx=Math.max(4,...wk.a,...wk.b),W=760,H=360,gx=70,bw=24;
 const bars=wk.a.map((v,i)=>{const x=gx+i*92;return`<rect x="${x}" y="${H-40-v/mx*(H-80)}" width="${bw}" height="${v/mx*(H-80)}" rx="5" fill="${FIG}"><animate attributeName="height" from="0" to="${v/mx*(H-80)}" dur=".8s"/><animate attributeName="y" from="${H-40}" to="${H-40-v/mx*(H-80)}" dur=".8s"/></rect><rect x="${x+bw+4}" y="${H-40-wk.b[i]/mx*(H-80)}" width="${bw}" height="${wk.b[i]/mx*(H-80)}" rx="5" fill="${PK}"/><text x="${x+bw}" y="${H-14}" text-anchor="middle" font-size="14">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</text>`}).join('');
 const grid=Array.from({length:mx+1},(_,i)=>`<line x1="40" x2="${W-10}" y1="${H-40-i/mx*(H-80)}" y2="${H-40-i/mx*(H-80)}" stroke="#E2D4DA"/><text x="28" y="${H-36-i/mx*(H-80)}" text-anchor="end" font-size="13">${i}</text>`).join('');
 return shell('tanam',`<section class="wrap pg"><h1 class="pt">Tanam Kebiasaan Hari Ini</h1><div class="mu">${dt}</div><div class="two"><div class="card" style="padding:26px 32px"><div id="hl">${D.habits.length?D.habits.map(h=>{const on=dn.has(h.id);return`<div class="row"><button class="cb ${on?'on':''}" data-act="tg" data-id="${h.id}" aria-label="Centang ${esc(h.t)}">${on?'✓':''}</button>${ui.edit===h.id?`<input class="in" id="ed" value="${esc(h.t)}" style="flex:1;padding:8px 16px"><button class="btn gr sm" data-act="edok" data-id="${h.id}">Simpan</button>`:`<span class="t ${on?'d':''}">${esc(h.t)}</span>${on?`<span class="chip">${drop(WAT,14)}+10</span>`:''}<button class="ib" data-act="ed" data-id="${h.id}" title="Ubah">✎</button><button class="ib" data-act="del" data-id="${h.id}" title="Hapus">✕</button>`}</div>`}).join(''):'<p class="mu" style="padding:2.2rem 0;text-align:center">Belum ada kebiasaan. Tulis kebiasaan pertamamu di bawah, lalu klik + Tanam.</p>'}</div><div class="add"><input class="in" id="nh" placeholder="Tulis kebiasaan baru..." maxlength="60"><button class="btn pk" data-act="add">+ Tanam</button></div></div><div style="display:grid;gap:22px"><div class="card pc"><div>Progres hari ini</div><div class="big">${p}%</div><div class="pb"><i style="width:${p}%"></i></div><div class="mu" style="margin:8px 0">${L.items.filter(i=>i.done).length} dari ${D.habits.length} kebiasaan selesai</div><div style="width:150px;margin:0 auto">${lot(st,150)}</div></div><div class="card" style="padding:20px 28px;display:flex;gap:16px;align-items:center">${drop(WAT,44)}<div><b style="font-size:22px">${D.pts} Poin Air</b><div class="mu" style="font-size:14px">+10 tiap kebiasaan dicentang</div></div></div></div></div></section><section class="wrap pg"><h2 class="ct">Seminggu Terakhir</h2><div class="two" style="grid-template-columns:1.5fr 1fr"><div class="card" style="padding:26px"><div style="text-align:center;margin-bottom:6px"><b style="color:${FIG}">●</b> Minggu Ini &nbsp; <b style="color:${PK}">●</b> Minggu Lalu</div><svg viewBox="0 0 ${W} ${H}" style="width:100%">${grid}${bars}${wk.a.concat(wk.b).every(v=>v==0)?`<text x="${W/2}" y="${H/2-10}" text-anchor="middle" font-size="17" fill="#6b5a62">Belum ada progres.</text><text x="${W/2}" y="${H/2+14}" text-anchor="middle" font-size="14" fill="#6b5a62">Centang kebiasaanmu agar grafik muncul.</text>`:''}</svg></div><div class="tips">${[['Mulai kecil','Dua menit sehari sudah cukup untuk memulai'],['Konsisten','Lebih baik sedikit tiap hari daripada banyak sekali-sekali'],['Rayakan','Tiap centang memberi Poin Air; hargai kemajuanmu']].map(t=>`<div class="card tip">${star(BY,44)}<div><b style="font-size:20px">${t[0]}</b><div class="mu" style="font-size:14.5px">${t[1]}</div></div></div>`).join('')}</div></div></section>`)},
tumbuh:()=>{const p=pctT(),st=stageOf(p),ly=layu(),y=dayData(dkey(addD(new Date(),-1)));const placed=D.layout.map(o=>o.k);return shell('tumbuh',`<section class="wrap pg"><h1 class="pt">Lotusmu Hari Ini</h1><div class="two" style="grid-template-columns:1.35fr 1fr"><div class="card lt">${pondH(st,{wilt:ly,glow:D.vit>=85&&!ly})}<h3>Tahap ${st+1} dari 5 - ${NAMES[st]}</h3><div class="pb g" style="margin:0 12px"><i style="width:${p}%"></i></div><div class="mu" style="text-align:center;margin:8px 0 6px">${p}% kebiasaan hari ini selesai</div></div><div style="display:grid;gap:22px"><div class="card" style="padding:26px;text-align:center"><h3>Kondisi</h3>${(()=>{const s=lotusState();return`<div style="margin:12px 0"><span class="pill ${s.c}">${s.l}</span></div><div class="mu">${s.l=='Sehat'&&y?`Kemarin ${y.pct}% selesai, lotus tetap segar`:s.m}</div>`})()}</div><div class="card" style="padding:26px;text-align:center"><h3>Jika bolos</h3><div style="margin:12px 0"><span class="pill no">Layu ringan</span></div><div class="mu">Bila kemarin di bawah 30%, lotus tampak layu sampai target tercapai atau disiram</div></div><div class="card" style="padding:20px 26px;display:flex;align-items:center;gap:14px">${drop(WAT,40)}<b style="font-size:22px;flex:1">${D.pts} Poin Air</b><button class="btn pk" data-go="rawat">Rawat Lotus</button></div></div></div></section><section class="wrap pg"><h2 class="ct">Lima Tahap Lotus</h2><div class="stg">${NAMES.map((n,i)=>`<div class="card sc ${i==st?'on':''}"><div class="a">${lot(i,i<2?80:96)}</div><h3 style="margin-top:12px;font-size:20px">${n}</h3><div class="mu">${RANGE[i]}</div></div>`).join('')}</div><div class="two" style="grid-template-columns:1fr 1fr"><div class="card" style="padding:26px"><h3>Hiasan Terpasang</h3><div style="display:flex;gap:18px;margin-top:12px;flex-wrap:wrap">${placed.length?placed.map(k=>`<div style="width:64px">${dvf(k)}</div>`).join(''):`<span class="mu">Belum ada. Atur di <a data-go="dekorasi" style="color:${BY};font-weight:600">Dekorasi</a>.</span>`}</div></div><div class="card" style="padding:26px"><h3>Hal yang Memengaruhi Lotusmu</h3><ul class="mu" style="margin:10px 0 0;padding-left:22px;line-height:2"><li>Persentase kebiasaan hari ini</li><li>Hasil kemarin (sehat atau layu)</li><li>Perawatan: siram, pupuk, bersihkan</li></ul></div></div></section>`)},
kebun:()=>{ui.km??=new Date(new Date().getFullYear(),new Date().getMonth(),1);ui.ks??=TODAY();const m=ui.km,first=new Date(m.getFullYear(),m.getMonth(),1),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),off=(first.getDay()+6)%7,td=TODAY();let cells='';for(let i=0;i<off;i++)cells+='<div></div>';for(let d=1;d<=n;d++){const k=dkey(new Date(m.getFullYear(),m.getMonth(),d)),i=dayData(k),lv=i&&i.pct>0?(i.pct<=25?'l0':i.pct<=50?'l1':i.pct<=75?'l2':'l3'):'ee';cells+=`<div class="cell ${lv} ${k==td?'td':''} ${k==ui.ks?'sl':''}" ${i&&i.items.length?`data-act="ks" data-k="${k}" tabindex="0"`:''}>${d}</div>`}
 const sel=dayData(ui.ks),sd=new Date(ui.ks+'T00:00');return shell('kebun',`<section class="wrap pg"><div style="text-align:center"><h1 class="pt">Kebun Konsistensi</h1><div class="mu" style="font-size:18px"><button class="ib" data-act="km" data-d="-1" aria-label="Bulan sebelumnya">‹</button><b>${m.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button class="ib" data-act="km" data-d="1" aria-label="Bulan berikutnya">›</button></div></div><div class="two" style="grid-template-columns:1.55fr 1fr"><div class="card" style="padding:28px"><div class="cal">${['S','S','R','K','J','S','M'].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div><div class="lg mu" style="margin-top:16px">Sedikit ${['ee','l0','l1','l2','l3'].map(c=>`<i class="${c}"></i>`).join('')} Banyak</div></div><div class="card" style="padding:30px"><h3 style="font-size:24px">${sd.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>${sel&&sel.items.length?`<div class="mu" style="margin:4px 0 14px">${sel.pct}% selesai</div>${sel.items.map(i=>`<div class="row" style="font-size:17px"><span style="color:${i.done?FIG:BY};font-weight:700;font-size:20px">${i.done?'✓':'✕'}</span>${esc(i.t)}</div>`).join('')}`:'<p class="mu">Belum ada kebiasaan atau progres di hari ini. Mulai dari menu Tanam.</p>'}</div></div></section>`)},
misi:()=>{const ids=misIds(D.mis.date),done=ids.filter(i=>D.mis.done[i]).length,yk=dkey(addD(new Date(),-1)),yl=D.misLog[yk]||[];return shell('misi',`<section class="wrap pg"><h1 class="pt" style="text-align:center">Misi Hari Ini</h1><div class="card" style="padding:22px 34px;display:flex;align-items:center;gap:26px;margin:22px 0"><b style="font-size:20px">Misi selesai ${done} dari 3</b><div class="pb g" style="flex:1"><i style="width:${done/3*100}%"></i></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px">${ids.map(id=>{const m=POOL.find(x=>x.id==id),v=Math.min(m.g,m.v(L0().act,pctT())),ok=D.mis.done[id];return`<div class="card mi"><div class="top"><div class="ibox">${icon(m.ic)}</div><div><h3 style="font-size:20px">${m.t}</h3><div class="mu" style="font-size:14.5px">${m.d}</div></div></div><div style="display:flex;justify-content:space-between"><b>Progres</b><span>${v} / ${m.g}</span></div><div class="pb ${ok?'b':''}"><i style="width:${v/m.g*100}%"></i></div><div class="ft" style="display:flex;justify-content:space-between;align-items:center"><span class="chip">${drop(WAT,15)}+15 poin</span>${ok?'<span class="pill ok">Selesai</span>':m.go?`<button class="btn pk sm" data-go="${m.go}">Buka</button>`:`<span class="pill ${v?'run':'no'}">${v?'Berjalan':'Belum'}</span>`}</div></div>`}).join('')}</div><div class="two" style="grid-template-columns:1fr 1.2fr"><div class="card" style="padding:28px;display:grid;gap:12px"><div style="display:flex;align-items:center;gap:16px"><div style="width:60px;height:60px;border-radius:16px;background:${BY};display:grid;place-items:center">${star('#fff',34)}</div><h3 style="font-size:22px;flex:1">Bonus ketiga misi tuntas</h3><span class="chip" style="background:${FG}">${drop(WAT,15)}+20</span></div><div class="mu">Selesaikan semua misi hari ini dan dapatkan tambahan Poin Air${D.mis.bonus?' <b style="color:'+FIG+'">(sudah diambil)</b>':''}</div></div><div class="card" style="padding:28px"><h3>Misi kemarin</h3>${yl.length?yl.map(m=>`<div class="row" style="justify-content:space-between"><span>${m.t}</span><span class="pill ${m.done?'ok':'no'}">${m.done?'Selesai':'Terlewat'}</span></div>`).join(''):'<p class="mu">Belum ada riwayat misi.</p>'}</div></div></section>`)},
rawat:()=>{const st=stageOf(pctT()),ly=layu();return shell('rawat',`<section class="wrap pg"><h1 class="pt" style="text-align:center">Rawat Lotusmu</h1><div class="two" style="grid-template-columns:1.15fr 1fr"><div class="card lt" style="position:relative"><div id="pwrap" style="position:relative">${pondH(st,{wilt:ly,glow:D.vit>=85&&!ly})}</div><div style="padding:16px 14px 6px"><div style="display:flex;justify-content:space-between"><b style="font-size:18px">Energi lotus</b><span>${D.vit}%</span></div><div class="pb b" style="margin:6px 0 12px"><i style="width:${D.vit}%"></i></div>${(()=>{const s=lotusState();return`<span class="pill ${s.c}">${s.l}</span> <span class="mu" style="margin-left:8px">${s.m}</span>`})()}</div></div><div style="display:grid;gap:18px"><div class="card" style="padding:24px 32px;display:flex;align-items:center;gap:20px">${drop(WAT,54)}<div><div>Saldo Poin Air</div><b class="lora" style="font-size:44px;line-height:1">${D.pts}</b></div></div>${[['siram','Siram','Pulihkan lotus layu ringan',10,drop(WAT,44)],['pupuk','Pupuk','Tambah energi lotus',20,icon('young')],['bersih','Bersihkan Kolam','Kolam bersih, lotus lebih segar',15,dvf('batu').replace('style="','style="width:48px;')]].map(a=>`<div class="card" style="padding:20px 26px;display:flex;align-items:center;gap:18px"><div class="ibox">${a[4]}</div><div style="flex:1"><h3 style="font-size:20px">${a[1]}</h3><div class="mu" style="font-size:14.5px">${a[2]}</div></div><button class="btn pk sm" data-act="care" data-t="${a[0]}">${a[1].split(' ')[0]} - ${a[3]} poin</button></div>`).join('')}</div></div></section>`)},
dekorasi:()=>{const SH=[['batu','Batu Kolam',30],['kodok','Katak',40],['capung','Capung',50],['kupu','Kupu-kupu',60],['koi','Ikan Koi',70],['bebek','Bebek Kecil',80]];ui.draft??=D.layout.map(o=>({...o}));const inP=new Set(ui.draft.map(o=>o.k)),st=stageOf(pctT());
 return shell('dekorasi',`<section class="wrap pg"><h1 class="pt" style="text-align:center">Toko Hiasan Kolam</h1><div style="text-align:center;margin:6px 0 24px"><span class="chip" style="font-size:16px">${drop(WAT,18)} ${D.pts} Poin Air</span></div><div class="shop">${SH.map(s=>`<div class="card si"><div class="a"><div style="width:${(s[0]=='koi'?120:92)/16}rem">${dvf(s[0])}</div></div><h3 style="margin:8px 0 2px">${s[1]}</h3><div style="display:flex;gap:6px;justify-content:center;align-items:center;margin-bottom:12px">${drop(WAT,16)}<b>${s[2]}</b></div>${D.owned[s[0]]?'<span class="pill ok">Dimiliki</span>':`<button class="btn gr sm" data-act="buy" data-k="${s[0]}" data-c="${s[2]}">Beli</button>`}</div>`).join('')}</div></section><section class="wrap pg"><h2 class="ct">Pratinjau & Koleksi</h2><div class="two" style="grid-template-columns:1.4fr 1fr"><div class="card lt">${pondH(st,{items:ui.draft,drop:true,id:'pdrop'})}<div style="padding:16px 12px 6px"><button class="btn pk" data-act="savel" style="width:100%">Simpan Tata Letak</button></div></div><div style="display:grid;gap:22px"><div class="card" style="padding:26px"><h3>Koleksi dimiliki</h3><div class="mu" style="font-size:14px;margin:4px 0 14px">Tarik hiasan ke kolam di sebelah kiri. Tarik keluar kolam untuk mengembalikan.</div><div class="tray">${Object.keys(D.owned).filter(k=>D.owned[k]).map(k=>`<div class="tr ${inP.has(k)?'out':''}" ${inP.has(k)?'':`data-drag data-from="tray" data-k="${k}"`}><div style="width:56px">${dvf(k)}</div></div>`).join('')||'<span class="mu">Belum ada hiasan. Beli dulu di toko di atas.</span>'}</div></div><div class="card" style="padding:26px"><h3>Cara menata</h3><ol class="mu" style="margin:8px 0 0;padding-left:22px;line-height:2"><li>Pilih hiasan dari koleksi</li><li>Tarik dan lepas ke kolam</li><li>Klik simpan tata letak</li></ol></div></div></div></section>`)}};
function weekData(){const now=new Date(),mon=addD(now,-((now.getDay()+6)%7)),f=d=>{const i=dayData(dkey(d));return i?i.items.filter(x=>x.done).length:0};return{a:Array.from({length:7},(_,i)=>f(addD(mon,i))),b:Array.from({length:7},(_,i)=>f(addD(mon,i-7)))}}
/* ---------- router ---------- */
const PUB=['landing','login','daftar','tentang','petunjuk'];
function route(){return(location.hash.replace(/^#\/?/,'')||'landing')}
function render(keep){const y=scrollY;let r=route();if(!ROUTES[r])r='landing';if(!PUB.includes(r)&&!sess){location.hash='#/login';return}if((r=='login'||r=='daftar')&&sess){location.hash='#/beranda';return}if(sess&&D)ensureToday();document.body.className='';$('#app').innerHTML=ROUTES[r]();document.title='Flourish · '+(r[0].toUpperCase()+r.slice(1));keep?scrollTo(0,y):scrollTo(0,0)}
const go=r=>{if(location.hash==='#/'+r)render();else location.hash='#/'+r};
addEventListener('hashchange',()=>{ui.edit=null;ui.draft=null;render()});
/* ---------- aksi ---------- */
async function loadUser(u){sess=u;LS.set('fl_sess',u);D=LS.get('fl_d_'+u,null);if(!D||D.v!==2)D=newData();ensureToday();save()}
document.addEventListener('submit',async e=>{if(e.target.id!=='af')return;e.preventDefault();const L=route()=='login',E=$('#er'),f=id=>($('#'+id)?.value||'').trim(),bad=m=>{E.textContent=m;E.className='err show'};const un=f('un').toLowerCase(),pw=$('#pw').value;
 if(!un||!pw)return bad('Lengkapi username/email dan kata sandi.');
 if(L){if(!users[un]||users[un].h!==await hash(pw))return bad('Data yang kamu masukkan belum sesuai. Coba lagi.');await loadUser(un);toast('Selamat datang kembali, '+users[un].name+'!');go('beranda')}
 else{const nm=f('nm');if(!nm)return bad('Nama lengkap wajib diisi.');if(users[un])return bad('Username/email sudah terdaftar. Silakan masuk.');if(pw.length<8)return bad('Kata sandi minimal 8 karakter.');if(pw!==$('#pw2').value)return bad('Konfirmasi kata sandi tidak sama.');users[un]={name:nm,h:await hash(pw)};LS.set('fl_users',users);D=null;sess=un;LS.set('fl_sess',un);D=newData();ensureToday();save();toast('Akun dibuat. Selamat menanam, '+nm+'!');go('beranda')}});
function fx(t){const w=$('#pwrap');if(!w)return;const f=document.createElement('div');f.className='fx';if(t=='siram')f.innerHTML=Array.from({length:14},(_,i)=>`<span style="position:absolute;left:${15+i*5.2}%;top:0;animation:dr 1.3s ${i*.07}s ease-in forwards;opacity:0">${drop('#6FA8E8',22)}</span>`).join('');else if(t=='pupuk')f.innerHTML=Array.from({length:10},(_,i)=>`<span class="sp" style="left:${20+i*6}%;top:${30+(i%3)*14}%;animation-delay:${i*.1}s">✨</span>`).join('');else f.innerHTML='<div class="sh"></div>';w.appendChild(f);setTimeout(()=>f.remove(),2200)}
document.addEventListener('click',e=>{const to=e.target.closest('[data-to]');if(to){e.preventDefault();const id=to.dataset.to,sc=()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'});if(route()==='landing')sc();else go(id=='deskripsi'?'tentang':'petunjuk');return}const a=e.target.closest('[data-act]'),g=e.target.closest('[data-go]'),s=e.target.closest('[data-scroll]');
 if(s){$(s.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}
 if(a){const t=a.dataset.act,id=a.dataset.id,L=L0?.call&&sess?L0():null;
  if(t=='tg'){const dn=L.done;if(dn.includes(id))L.done=dn.filter(x=>x!=id);else{dn.push(id);if(!L.awarded.includes(id)){L.awarded.push(id);D.pts+=10}if(new Date().getHours()<12)L.act.early=1}L.act.checks=L.done.length;commit();render(1)}
  else if(t=='add'){const v=$('#nh').value.trim();if(!v){toast('Tulis dulu kebiasaannya.','warn');return}D.habits.push({id:'h'+Date.now(),t:v});L.act.added++;commit();render(1);toast('Kebiasaan ditanam!')}
  else if(t=='del'){D.habits=D.habits.filter(h=>h.id!=id);L.done=L.done.filter(x=>x!=id);L.act.checks=L.done.length;commit();render(1)}
  else if(t=='ed'){ui.edit=id;render(1);$('#ed')?.focus()}
  else if(t=='edok'){const v=$('#ed').value.trim();if(v)D.habits.find(h=>h.id==id).t=v;ui.edit=null;commit();render(1)}
  else if(t=='ks'){ui.ks=a.dataset.k;render(1)}
  else if(t=='km'){ui.km=new Date(ui.km.getFullYear(),ui.km.getMonth()+ +a.dataset.d,1);render(1)}
  else if(t=='care'){const c={siram:[10,'watered',12,'Lotus disiram. Segar kembali!'],pupuk:[20,'fert',20,'Lotus dipupuk. Energi bertambah!'],bersih:[15,'clean',15,'Kolam bersih berkilau!']}[a.dataset.t];if(D.pts<c[0]){toast('Poin Air belum cukup. Selesaikan kebiasaan atau misi dulu.','warn');return}D.pts-=c[0];L.act[c[1]]++;D.vit=Math.min(100,D.vit+c[2]);commit();render(1);fx(a.dataset.t);toast(c[3])}
  else if(t=='buy'){const c=+a.dataset.c;if(D.pts<c){toast('Poin Air belum cukup untuk hiasan ini.','warn');return}D.pts-=c;D.owned[a.dataset.k]=true;save();render(1);toast('Hiasan dibeli! Tata di bagian Pratinjau & Koleksi.')}
  else if(t=='savel'){D.layout=ui.draft.map(o=>({...o}));save();toast('Tata letak tersimpan. Lihat hasilnya di Tumbuh!')}
  else if(t=='logout'){sess=null;D=null;ui={edit:null,km:null,ks:null,draft:null};LS.set('fl_sess',null);go('landing')}
  else if(t=='reset'){if(confirm('Atur ulang semua data contoh akunmu?')){const u=sess;D=newData();ensureToday();save();ui={edit:null,km:null,ks:null,draft:null};render();toast('Data diatur ulang.')}}
  return}
 if(g){e.preventDefault();go(g.dataset.go)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){if(e.target.id=='nh')$('[data-act=add]').click();else if(e.target.id=='ed')$('[data-act=edok]').click();else if(e.target.dataset?.go||e.target.dataset?.act)e.target.click()}});
/* ---------- drag & drop hiasan ---------- */
document.addEventListener('pointerdown',e=>{const it=e.target.closest('[data-drag]');if(!it)return;e.preventDefault();const k=it.dataset.k,from=it.dataset.from,gh=document.createElement('div');gh.className='ghost';gh.style.width=(k=='koi'?96:70)+'px';gh.innerHTML=dvf(k);document.body.appendChild(gh);const mv=ev=>{gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px';const p=$('#pdrop');if(p){const r=p.getBoundingClientRect();p.classList.toggle('drop',ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom)}};mv(e);if(from=='pond')it.classList.add('dg');
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);gh.remove();const p=$('#pdrop');p?.classList.remove('drop');if(p){const r=p.getBoundingClientRect(),inside=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;ui.draft=ui.draft.filter(o=>o.k!=k);if(inside)ui.draft.push({k,x:Math.round((ev.clientX-r.left)/r.width*1000)/10,y:Math.round((ev.clientY-r.top)/r.height*1000)/10});render(1)}};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
/* ---------- mulai ---------- */
const bgSVG=()=>`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMaxYMax slice" style="width:100%;height:100%"><circle cx="1400" cy="120" r="180" fill="#fff" opacity=".28"/><circle cx="220" cy="260" r="110" fill="#fff" opacity=".2"/>${[[1390,835,260,26,.65],[1390,835,170,16,.8]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[3]}" fill="none" stroke="#fff" stroke-width="2.5" opacity="${p[4]}"/>`).join('')}<g transform="translate(1190 300) scale(2.15)">${plantG(4,false)}</g></svg>`;
document.body.insertAdjacentHTML('afterbegin',DEFS+'<div id="bgd">'+bgSVG()+'</div>'+'<div id="app"></div><div id="toast" class="toast" role="status"></div>');
if(sess){D=LS.get('fl_d_'+sess,null);if(!D||D.v!==2||!users[sess]){sess=null;D=null}}
if(!location.hash)location.hash='#/landing';render();

</script></body></html>
